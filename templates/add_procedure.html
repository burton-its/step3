<!DOCTYPE html>
<html>
<head>
    <title>Add Procedure</title>
</head>
<body>
    <h1>Add Procedure</h1>

    <form method="POST">
        <label>Patient ID</label><br>
        <input name="patient_id" required><br><br>

        <label>Procedure Date</label><br>
        <input name="procedure_date" type="date" required><br><br>

        <label>Procedure Type ID</label><br>
        <input name="procedure_type_id" required><br><br>

        <button type="submit">Add</button>
    </form>

    <br>
    <a href="/browse_procedures">Cancel</a>
</body>
</html>
