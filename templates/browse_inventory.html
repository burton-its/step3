{% extends "base.html" %}

{% block title %}Browse Inventory{% endblock %}

{% block content %}
    <h1>Inventory</h1>

    <table border="1">
    <tr>
        <th>Product ID</th>
        <th>Name</th>
        <th>Cost</th>

    </tr>

    {% for inventory in inventories %}
    <tr>
        <td>{{ inventory.product_id }}</td>
        <td>{{ inventory.product_name }}</td>
        <td>{{ inventory.unit_cost }}</td>
    </tr>
    {% endfor %}
</table>

    <a href="/">Back to Home</a>
{% endblock %}
